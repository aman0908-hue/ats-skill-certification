<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <!-- Shield Outline -->
  <path d="M50 5 L88 20 C88 58 50 92 50 92 C50 92 12 58 12 20 Z" fill="url(#primaryGrad)" stroke="#F59E0B" stroke-width="2.5"/>
  <!-- Inner Shield Accent -->
  <path d="M50 14 L80 26 C80 54 50 82 50 82 C50 82 20 54 20 26 Z" fill="#0F172A" opacity="0.4"/>
  <!-- Laurel / Ribbon Star -->
  <circle cx="50" cy="45" r="18" fill="url(#goldGrad)" opacity="0.9"/>
  <!-- Checkmark / Quill mark -->
  <path d="M42 45 L48 51 L60 38" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Letters ATS -->
  <text x="50" y="73" font-family="'Outfit', sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">ATS</text>
</svg>
