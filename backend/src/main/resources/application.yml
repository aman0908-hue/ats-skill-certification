    name: ${ADMIN_NAME:ATS System Administrator}
  certificates:
    storage-path: ${CERT_STORAGE_PATH:certificates}
    template-asset-path: ${CERT_TEMPLATE_PATH:templates/certificate-template.png}

logging:
  level:
    root: INFO
    com.atsskill: DEBUG
    org.springframework.data.mongodb: INFO
