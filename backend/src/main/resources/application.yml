    include-binding-errors: always

spring:
  application:
    name: ats-skill-certification-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://satyamydv8230_db_user:Aman9080@cluster0.eduh5gu.mongodb.net/ats_skill_certification?retryWrites=true&w=majority&appName=Cluster0}
